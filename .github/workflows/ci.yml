name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/typescript/bin/tsc -b --pretty false
      - run: node node_modules/typescript/bin/tsc -p apps/mcp-app/tsconfig.json --pretty false
      - run: node node_modules/typescript/bin/tsc -p infra/tsconfig.json --pretty false
      - run: node node_modules/vitest/vitest.mjs run --config vitest.config.ts
      - run: pnpm test:mcp
      - run: pnpm --filter @employee-plus/mcp-app exec vite build

  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: employee-plus:mvp
          cache-from: type=gha
          cache-to: type=gha,mode=max
